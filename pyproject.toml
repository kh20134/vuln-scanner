[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscan"
version = "0.1.0"
description = "인가된 네트워크·서버·엔드포인트에 대한 CVE/CWE 기반 방어적 취약점 점검 도구"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "최규선" }]
keywords = ["cve", "cwe", "vulnerability", "defensive"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
vulnscan = "vulnscan.cli:main"

[project.urls]
Homepage = "https://github.com/kh20134/vuln-scanner"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vulnscan = ["data/sample/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
